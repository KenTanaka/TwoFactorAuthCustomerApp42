name: CI for TwoFactorAuthCustomerApp44
on:
  push:
    branches:
      - '*'
    tags:
      - '*'
    paths:
      - '**'
      - '!*.md'
  pull_request:
    branches:
      - '*'
    paths:
      - '**'
      - '!*.md'
jobs:
  run-on-linux:
    name: Run on Linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        eccube_version: [ '4.4' ]
        php: [ '8.2', '8.3', '8.4', '8.5' ]
        db: [ 'mysql8', 'pgsql' ]
        plugin_code: [ 'TwoFactorAuthCustomerApp44' ]
        include:
          - db: mysql8
            database_url: mysql://root:password@127.0.0.1:3308/eccube_db
            database_server_version: 8
            database_charset: utf8mb4
          - db: pgsql
            database_url: postgres://postgres:password@127.0.0.1:5432/eccube_db
            database_server_version: 14
            database_charset: utf8
    services:
      mysql8:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: ${{ matrix.dbname }}
        ports:
          - 3308:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ${{ matrix.dbname }}
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      mailcatcher:
        image: schickling/mailcatcher
        ports:
          - 1080:1080
          - 1025:1025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: nanasess/setup-php@master
        with:
          php-version: ${{ matrix.php }}

      - name: Archive Plugin
        env:
          PLUGIN_CODE: ${{ matrix.plugin_code }}
        run: |
          tar cvzf ${GITHUB_WORKSPACE}/${PLUGIN_CODE}.tar.gz ./*

      - name: Checkout Base Plugin
        uses: actions/checkout@v4
        with:
          repository: 'EC-CUBE/TwoFactorAuthCustomer42'
          ref: '4.4'
          path: 'TwoFactorAuthCustomer44'

      - name: Archive Base Plugin
        working-directory: 'TwoFactorAuthCustomer44'
        run: |
          tar cvzf ${GITHUB_WORKSPACE}/TwoFactorAuthCustomer44.tar.gz ./*

      - name: Setup mock-package-api
        env:
          PLUGIN_CODE: ${{ matrix.plugin_code }}
        run: |
          mkdir -p /tmp/repos
          for f in ${PLUGIN_CODE} TwoFactorAuthCustomer44; do
            cp ${GITHUB_WORKSPACE}/${f}.tar.gz /tmp/repos/${f}.tgz
          done
          docker run --name package-api -d -v /tmp/repos:/repos -e MOCK_REPO_DIR=/repos -p 8080:8080 eccube/mock-package-api:composer2

      - name: Checkout EC-CUBE
        uses: actions/checkout@v4
        with:
          repository: 'EC-CUBE/ec-cube'
          ref: ${{ matrix.eccube_version }}
          path: 'ec-cube'

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Install to composer
        working-directory: 'ec-cube'
        # Symfony 7.4 の symfony/cache が ext-redis <6.1 と衝突するが、ランナーには
        # 古い php-redis(5.3.7) が入っている。本プラグイン/本体テストは redis 未使用のため無視する。
        run: composer install --no-interaction -o --apcu-autoloader --ignore-platform-req=ext-redis

      - name: Setup EC-CUBE
        env:
          APP_ENV: 'test'
          APP_DEBUG: 0
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          DATABASE_CHARSET: ${{ matrix.database_charset }}
          ECCUBE_PACKAGE_API_URL: 'http://127.0.0.1:8080'
        working-directory: 'ec-cube'
        run: |
          bin/console doctrine:database:create
          bin/console doctrine:schema:create
          bin/console eccube:fixtures:load
      - name: Setup Plugin
        env:
          APP_ENV: 'test'
          APP_DEBUG: 0
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          DATABASE_CHARSET: ${{ matrix.database_charset }}
          PLUGIN_CODE: ${{ matrix.plugin_code }}
          ECCUBE_PACKAGE_API_URL: 'http://127.0.0.1:8080'
        working-directory: 'ec-cube'
        run: |
          bin/console eccube:composer:require ec-cube/twofactorauthcustomer44
          bin/console eccube:plugin:enable --code=TwoFactorAuthCustomer44
          bin/console eccube:composer:require ec-cube/twofactorauthcustomerapp44
          bin/console eccube:plugin:enable --code=${PLUGIN_CODE}
          bin/console cache:clear --no-warmup

      - name: Run PHPUnit
        env:
          APP_ENV: 'test'
          APP_DEBUG: 0
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          DATABASE_CHARSET: ${{ matrix.database_charset }}
          PLUGIN_CODE: ${{ matrix.plugin_code }}
          ECCUBE_PACKAGE_API_URL: 'http://127.0.0.1:8080'
        working-directory: 'ec-cube'
        run: |
          # 有効化したプラグインのルーティングはコンテナのコンパイル時に確定する。
          # phpunit プロセスでの遅延コンパイルに任せると DB/タイミングで有効プラグイン一覧を
          # 取りこぼし RouteNotFound になることがあるため、クリーンなプロセスで warmup して確定させる。
          bin/console cache:clear --no-warmup
          bin/console cache:warmup
          if [ -d "app/Plugin/${PLUGIN_CODE}/Tests" ]; then
            ./vendor/bin/phpunit -c app/Plugin/${PLUGIN_CODE}/phpunit.xml.dist app/Plugin/${PLUGIN_CODE}/Tests
          fi

      - name: Disable Plugin
        working-directory: 'ec-cube'
        env:
          APP_ENV: 'test'
          APP_DEBUG: 0
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          DATABASE_CHARSET: ${{ matrix.database_charset }}
          PLUGIN_CODE: ${{ matrix.plugin_code }}
          ECCUBE_PACKAGE_API_URL: 'http://127.0.0.1:8080'
        run: bin/console eccube:plugin:disable --code=${PLUGIN_CODE}

      - name: Uninstall Plugin
        env:
          APP_ENV: 'test'
          APP_DEBUG: 0
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          DATABASE_CHARSET: ${{ matrix.database_charset }}
          PLUGIN_CODE: ${{ matrix.plugin_code }}
          ECCUBE_PACKAGE_API_URL: 'http://127.0.0.1:8080'
        working-directory: 'ec-cube'
        run: bin/console eccube:plugin:uninstall --code=${PLUGIN_CODE}

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-24.04
    # 静的解析は DB 種別に依存しないため、SQLite 1 構成で一度だけ実行する。
    # （php-cs-fixer / rector は DB 不要だが、phpstan は objectManagerLoader が
    #   カーネルを起動し EccubeExtension が dtb_plugin を読むため本体+DBが必要）
    env:
      PLUGIN_CODE: TwoFactorAuthCustomerApp44
      PARENT_PLUGIN_CODE: TwoFactorAuthCustomer44
      APP_ENV: 'test'
      APP_DEBUG: 0
      DATABASE_URL: 'sqlite:///var/eccube.db'
      DATABASE_SERVER_VERSION: 3
      DATABASE_CHARSET: 'utf8'
      ECCUBE_PACKAGE_API_URL: 'http://127.0.0.1:8080'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: nanasess/setup-php@master
        with:
          php-version: '8.5'

      - name: Archive Plugin
        run: |
          tar cvzf ${GITHUB_WORKSPACE}/${PLUGIN_CODE}.tar.gz ./*

      - name: Checkout Base Plugin
        uses: actions/checkout@v4
        with:
          repository: 'EC-CUBE/TwoFactorAuthCustomer42'
          ref: '4.4'
          path: 'TwoFactorAuthCustomer44'

      - name: Archive Base Plugin
        working-directory: 'TwoFactorAuthCustomer44'
        run: |
          tar cvzf ${GITHUB_WORKSPACE}/TwoFactorAuthCustomer44.tar.gz ./*

      - name: Setup mock-package-api
        run: |
          mkdir -p /tmp/repos
          for f in ${PLUGIN_CODE} ${PARENT_PLUGIN_CODE}; do
            cp ${GITHUB_WORKSPACE}/${f}.tar.gz /tmp/repos/${f}.tgz
          done
          docker run --name package-api -d -v /tmp/repos:/repos -e MOCK_REPO_DIR=/repos -p 8080:8080 eccube/mock-package-api:composer2

      - name: Checkout EC-CUBE
        uses: actions/checkout@v4
        with:
          repository: 'EC-CUBE/ec-cube'
          ref: '4.4'
          path: 'ec-cube'

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Install to composer
        working-directory: 'ec-cube'
        run: composer install --no-interaction -o --apcu-autoloader --ignore-platform-req=ext-redis

      - name: Setup EC-CUBE
        working-directory: 'ec-cube'
        run: |
          # DBAL 4 の SQLite は doctrine:database:create 非対応（getCreateDatabaseSQL が削除済み）。
          # 本体 InstallerCommand と同様、SQLite ではファイル作成をスキップし schema:create で用意する。
          if [[ "${DATABASE_URL}" != sqlite* ]]; then
            bin/console doctrine:database:create
          fi
          bin/console doctrine:schema:create
          bin/console eccube:fixtures:load
      - name: Setup Plugin
        working-directory: 'ec-cube'
        run: |
          bin/console eccube:composer:require ec-cube/twofactorauthcustomer44
          bin/console eccube:plugin:enable --code=TwoFactorAuthCustomer44
          bin/console eccube:composer:require ec-cube/twofactorauthcustomerapp44
          bin/console eccube:plugin:enable --code=${PLUGIN_CODE}
          bin/console cache:clear --no-warmup

      - name: Run php-cs-fixer
        working-directory: 'ec-cube'
        run: ./vendor/bin/php-cs-fixer fix --config=app/Plugin/${PLUGIN_CODE}/Resource/.php-cs-fixer.dist.php --dry-run --diff

      - name: Run Rector
        working-directory: 'ec-cube'
        run: ./vendor/bin/rector process --config=app/Plugin/${PLUGIN_CODE}/Resource/rector.php --dry-run

      - name: Run PHPStan
        working-directory: 'ec-cube'
        run: |
          bin/console cache:clear --no-warmup
          ./vendor/bin/phpstan analyse -c app/Plugin/${PLUGIN_CODE}/phpstan.neon.dist --no-progress
